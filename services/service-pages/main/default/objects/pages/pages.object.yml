enable_audit: false
enable_chatter: false
enable_enhanced_lookup: false
enable_events: false
enable_files: false
enable_inline_edit: true
enable_instances: false
enable_notes: false
enable_search: false
enable_share: false
enable_tasks: false
enable_workflow: false
hidden: true
icon: contract
is_enable: true
label: 微页面
version: 2
paging:
