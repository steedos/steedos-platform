name: push_devices
label: Push Devices
icon: phone_portrait
hidden: true
enable_api: true
fields:
  device_id:
    type: text
    label: Device ID
    required: true
    index: true
    is_wide: true
    sort_no: 100
  platform:
    type: select
    label: Platform
    required: true
    sort_no: 200
    options:
      - label: iOS
        value: ios
      - label: Android
        value: android
  provider:
    type: select
    label: Provider
    required: true
    sort_no: 300
    options:
      - label: GeTui
        value: getui
      - label: FCM
        value: fcm
  device_name:
    type: text
    label: Device Name
    sort_no: 400
  is_active:
    type: boolean
    label: Active
    defaultValue: true
    sort_no: 500
  last_active:
    type: datetime
    label: Last Active
    sort_no: 600
list_views:
  all:
    label: All
    columns:
      - device_id
      - platform
      - provider
      - is_active
      - last_active
      - owner
    filter_scope: space
    sort:
      - field_name: last_active
        order: desc
permission_set:
  user:
    allowCreate: true
    allowDelete: true
    allowEdit: true
    allowRead: true
    modifyAllRecords: false
    viewAllRecords: false
  admin:
    allowCreate: true
    allowDelete: true
    allowEdit: true
    allowRead: true
    modifyAllRecords: true
    viewAllRecords: true
