name: object_actions
label: Object Action
icon: actions_and_buttons
isMetadata: true
enable_dataloader: false
hidden: true
version: 2
paging:
  enabled: false
fields:
  amis_schema:
    name: amis_schema
    label: Amis Schema
    sort_no: 170
    type: code
    language: json
    required: false
    is_wide: true
    visible_on: '{{false}}'
  description:
    name: description
    label: Description
    type: textarea
    is_wide: true
    sort_no: 190
  is_enable:
    name: is_enable
    type: boolean
    label: Enable
    sort_no: 130
    defaultValue: true
  is_system:
    name: is_system
    type: boolean
    label: System
    readonly: true
    visible_on: '{{global.mode ===''read'' ? true : false}}'
    disabled: true
    sort_no: 180
  label:
    name: label
    type: text
    label: Label
    required: true
    is_name: true
    sort_no: 110
  name:
    name: name
    type: text
    sort_no: 120
    label: API Name
    searchable: true
    index: true
    required: true
    inlineHelpText: 'Can only contain lowercase letters and numbers, must start with a letter, cannot end with an underscore character or contain two consecutive underscore characters'
  object:
    name: object
    type: master_detail
    reference_to: objects
    reference_to_field: name
    write_requires_master_read: true
    required: true
    label: Object
    create: false
    sort_no: 100
  'on':
    name: 'on'
    type: lookup
    label: 'On'
    is_wide: true
    required: true
    showIcon: false
    sort_no: 150
    options:
      - label: 显示在列表右上角
        value: list
        icon: contact_list
      - label: 显示在记录查看页右上角，以及列表视图中每项的下拉菜单中
        value: record
        icon: contact_list
      - label: 显示在记录查看页右上角的“更多”下拉菜单中，以及列表视图中每项的下拉菜单中
        value: record_more
        icon: lead_list
      - label: 显示在列表视图中每项的下拉菜单中
        value: list_item
        icon: action_list_component
      - label: 显示在记录查看页右上角
        value: record_only
        icon: contract
      - label: 显示在记录查看页右上角的“更多”下拉菜单中
        value: record_only_more
        icon: lead_list
  type:
    name: type
    type: select
    sort_no: 160
    visible_on: '${false}'
    options:
      - label: Custom JavaScript
        value: script
      - label: Amis Button
        value: amis_button
    defaultValue: amis_button
  visible:
    name: visible
    type: boolean
    label: Visible
    is_wide: false
    sort_no: 140
    defaultValue: true
