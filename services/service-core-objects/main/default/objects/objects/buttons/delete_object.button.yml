name: delete_object
amis_schema: |-
  {
      "type": "service",
      "body": [
          {
              "type": "button",
              "label": "${'CustomAction.objects.delete_object' | t}",
              "id": "u:delete_object",
              "onEvent": {
                  "click": {
                      "actions": [
                          {
                              "actionType": "dialog",
                              "dialog": {
                                  "type": "dialog",
                                  "title": "${'CustomLabels.objects_actions_delete_object_dialog_title_prefix' | t} ${record.label}",
                                  "body": [
                                      {
                                          "type": "tpl",
                                          "tpl": "${'CustomLabels.objects_actions_delete_object_dialog_content' | t}",
                                          "inline": true,
                                          "id": "u:6d0819fc0bda"
                                      }
                                  ],
                                  "id": "u:b5c0f98dc113",
                                  "closeOnEsc": false,
                                  "closeOnOutside": false,
                                  "showCloseButton": true,
                                  "data": {
                                      "&": "$$",
                                      "recordId": "${recordId}",
                                      "record": "${record}"
                                  },
                                  "onEvent": {
                                      "confirm": {
                                          "weight": 0,
                                          "actions": [
                                              {
                                                  "componentId": "",
                                                  "args": {
                                                      "api": {
                                                          "url": "${context.rootUrl}/graphql",
                                                          "method": "post",
                                                          "data": {
                                                                "&": "$$",
                                                                "recordId": "${recordId}"
                                                            },
                                                          "requestAdaptor": "const recordId = api.data.recordId; \napi.data = {\n  query: `\n    mutation{\n    objects__delete(id: \"${recordId}\")\n  }\n  `\n}",
                                                          "headers": {
                                                              "Authorization": "Bearer ${context.tenantId},${context.authToken}"
                                                          }
                                                      },
                                                      "messages": {}
                                                  },
                                                  "actionType": "ajax"
                                              },
                                              {
                                                "actionType": "broadcast",
                                                "args": {
                                                    "eventName": "@data.changed.objects"
                                                },
                                                "data": {
                                                    "objectName": "objects",
                                                    "__deletedRecord": true
                                                }
                                            }
                                          ]
                                      }
                                  }
                              }
                          }
                      ],
                      "weight": 0
                  }
              }
          }
      ],
      "regions": [
          "body"
      ],
      "data": {
      },
      "bodyClassName": "p-0",
      "id": "u:46d1821365fc"
  }
is_enable: true
label: 删除
'on': record_only_more
type: amis_button
