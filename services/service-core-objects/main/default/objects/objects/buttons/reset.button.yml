name: reset
amis_schema: |-
  {
      "type": "service",
      "body": [
          {
              "type": "button",
              "label": "${'CustomAction.objects.reset' | t}",
              "id": "u:reset",
              "onEvent": {
                  "click": {
                      "actions": [
                          {
                              "actionType": "dialog",
                              "dialog": {
                                  "type": "dialog",
                                  "title": "${'CustomLabels.objects_actions_reset_dialog_title_prefix' | t} ${record.label}",
                                  "body": [
                                      {
                                          "type": "tpl",
                                          "tpl": "${'CustomLabels.objects_actions_reset_dialog_content' | t}",
                                          "inline": true,
                                          "id": "u:6d0819fc0bda"
                                      }
                                  ],
                                  "id": "u:b5c0f98dc113",
                                  "closeOnEsc": false,
                                  "closeOnOutside": false,
                                  "showCloseButton": true,
                                  "data": {
                                      "&": "$$",
                                      "recordId": "${recordId}",
                                      "record": "${record}"
                                  },
                                  "onEvent": {
                                      "confirm": {
                                          "weight": 0,
                                          "actions": [
                                              {
                                                  "componentId": "",
                                                  "args": {
                                                      "api": {
                                                          "url": "/service/api/~database-objects/reset",
                                                          "method": "post",
                                                          "data": {
                                                            "objectName": "${record.name}"
                                                          }
                                                      },
                                                      "messages": {}
                                                  },
                                                  "actionType": "ajax"
                                              },
                                              {
                                                "actionType": "custom",
                                                "script": "window.location.reload();"
                                              }
                                          ]
                                      }
                                  }
                              }
                          }
                      ],
                      "weight": 0
                  }
              }
          }
      ],
      "regions": [
          "body"
      ],
      "data": {
      },
      "bodyClassName": "p-0",
      "id": "u:46d1821365fc"
  }
is_enable: true
label: 重置
'on': record_only_more
type: amis_button
