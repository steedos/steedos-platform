  object:
    name: object
    type: text
    label: 对象
    filterable: true
    searchable: true
  related_to:
    label: 相关项
    type: lookup
    index: true
    reference_to: !<tag:yaml.org,2002:js/function> |-
      function anonymous(
      ) {

            try{
              let objects = [];
              var queryResult = Steedos.authRequest(`/graphql`, {
                  type: 'POST', async: false, 
                  data: JSON.stringify({
                    query: `{ objects{ name,space,enable_tasks } }`
                  })
              });
              objects = queryResult && queryResult.data && queryResult.data.objects;
              return _.map(objects, 'name') ;
            }catch(e){
              return []
            }

      }
    name: related_to
    filterable: true
  remote_addr:
    name: remote_addr
    label: IP 地址
    type: text
    sort_no: 25
  remote_user:
