<svg width="794" height="1123" viewBox="0 0 794 1123" xmlns="http://www.w3.org/2000/svg" style="font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0052cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d99;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6554c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9575cd;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="white" />
  
  <rect x="0" y="0" width="794" height="15" fill="#0052cc" />

  <text x="397" y="60" text-anchor="middle" font-size="28" font-weight="bold" fill="#333">Steedos低代码平台全景</text>
  <text x="397" y="90" text-anchor="middle" font-size="14" fill="#666">AI Native · Agile · Enterprise Grade</text>

  <g transform="translate(47, 120)">
    <rect x="0" y="0" width="700" height="90" rx="8" fill="#f5f9ff" stroke="#2196f3" stroke-width="1" stroke-dasharray="6,4"/>
    
    <rect x="20" y="-15" width="120" height="30" rx="4" fill="#1976d2" filter="url(#shadow)"/>
    <text x="80" y="5" text-anchor="middle" fill="white" font-size="14" font-weight="bold">全渠道触达</text>

    <g transform="translate(50, 35)">
      <rect x="0" y="0" width="130" height="40" rx="5" fill="white" stroke="#bbdefb" stroke-width="1"/>
      <text x="65" y="25" text-anchor="middle" fill="#333" font-size="13">💻 Web 门户</text>
      
      <rect x="155" y="0" width="130" height="40" rx="5" fill="white" stroke="#bbdefb" stroke-width="1"/>
      <text x="220" y="25" text-anchor="middle" fill="#333" font-size="13">📱 移动/小程序</text>
      
      <rect x="310" y="0" width="130" height="40" rx="5" fill="white" stroke="#bbdefb" stroke-width="1"/>
      <text x="375" y="25" text-anchor="middle" fill="#333" font-size="13">💬 企微/钉钉</text>
      
      <rect x="465" y="0" width="130" height="40" rx="5" fill="white" stroke="#bbdefb" stroke-width="1"/>
      <text x="530" y="25" text-anchor="middle" fill="#333" font-size="13">📺 大屏/IoT</text>
    </g>
  </g>

  <path d="M397,210 L397,230" stroke="#ccc" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(47, 240)">
    <rect x="0" y="0" width="700" height="340" rx="10" fill="#fff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
    
    <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">核心能力中台</text>

