      <text x="100" y="30" text-anchor="middle" font-weight="bold" fill="#1565c0" font-size="15">🏗️ 敏捷工厂</text>
      
      <rect x="15" y="50" width="170" height="35" rx="4" fill="white"/>
      <text x="100" y="73" text-anchor="middle" font-size="12" fill="#333">拖拽式 UI 设计器</text>
      
      <rect x="15" y="95" width="170" height="35" rx="4" fill="white"/>
      <text x="100" y="118" text-anchor="middle" font-size="12" fill="#333">流程建模 (BPM)</text>
      
