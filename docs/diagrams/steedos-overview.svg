      <text x="100" y="30" text-anchor="middle" font-weight="bold" fill="#2e7d32" font-size="15">🔌 开放连接</text>
      
      <rect x="15" y="50" width="170" height="35" rx="4" fill="white"/>
      <text x="100" y="73" text-anchor="middle" font-size="12" fill="#333">API 网关</text>
      
      <rect x="15" y="95" width="170" height="35" rx="4" fill="white"/>
      <text x="100" y="118" text-anchor="middle" font-size="12" fill="#333">第三方连接器</text>
      
      <rect x="15" y="140" width="170" height="35" rx="4" fill="white"/>
      <text x="100" y="163" text-anchor="middle" font-size="12" fill="#333">Webhooks / 事件</text>
      
      <rect x="15" y="185" width="170" height="35" rx="4" fill="white"/>
      <text x="100" y="208" text-anchor="middle" font-size="12" fill="#333">应用市场</text>
    </g>
