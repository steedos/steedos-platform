      <text x="110" y="40" text-anchor="middle" font-size="40">🧠</text>
      <text x="110" y="80" text-anchor="middle" font-weight="bold" fill="white" font-size="18">AI 智能中枢</text>
      <line x1="30" y1="100" x2="190" y2="100" stroke="white" stroke-opacity="0.5"/>
      
      <text x="110" y="130" text-anchor="middle" fill="white" font-size="13">Copilot 助手</text>
      <text x="110" y="160" text-anchor="middle" fill="white" font-size="13">NL2App (自然语言建应用)</text>
      <text x="110" y="190" text-anchor="middle" fill="white" font-size="13">企业知识库问答 (RAG)</text>
      <text x="110" y="220" text-anchor="middle" fill="white" font-size="13">智能流程预测</text>
    </g>

    <g transform="translate(480, 60)">
