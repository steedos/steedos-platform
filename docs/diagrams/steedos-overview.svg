  <path d="M397,580 L397,600" stroke="#ccc" stroke-width="2"/>

  <g transform="translate(47, 610)">
    <rect x="0" y="0" width="700" height="420" rx="10" fill="#263238" filter="url(#shadow)"/>
    
    <rect x="250" y="-15" width="200" height="36" rx="18" fill="#37474f" stroke="#546e7a"/>
    <text x="350" y="10" text-anchor="middle" fill="white" font-size="16" font-weight="bold">企业级数字化底座</text>

    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="310" height="170" rx="6" fill="#37474f" stroke="#455a64" stroke-width="1"/>
      <text x="20" y="30" fill="#ffca28" font-size="16" font-weight="bold">🛡️ 安全与合规</text>
      <line x1="20" y1="45" x2="290" y2="45" stroke="#546e7a"/>
      
      <text x="25" y="75" fill="#cfd8dc" font-size="13">• 统一身份认证 (IAM/SSO)</text>
      <text x="25" y="100" fill="#cfd8dc" font-size="13">• 字段级权限控制 (ACL/RBAC)</text>
      <text x="25" y="125" fill="#cfd8dc" font-size="13">• 敏感数据加密与脱敏</text>
      <text x="25" y="150" fill="#cfd8dc" font-size="13">• 全链路审计日志</text>
    </g>

    <g transform="translate(360, 40)">
      <rect x="0" y="0" width="310" height="170" rx="6" fill="#37474f" stroke="#455a64" stroke-width="1"/>
      <text x="20" y="30" fill="#42a5f5" font-size="16" font-weight="bold">💾 数据内核引擎</text>
      <line x1="20" y1="45" x2="290" y2="45" stroke="#546e7a"/>
      
      <text x="25" y="75" fill="#cfd8dc" font-size="13">• 元数据驱动架构 (Metadata)</text>
      <text x="25" y="100" fill="#cfd8dc" font-size="13">• 多租户物理/逻辑隔离</text>
      <text x="25" y="125" fill="#cfd8dc" font-size="13">• 千万级高并发读写</text>
      <text x="25" y="150" fill="#cfd8dc" font-size="13">• 向量数据库支持 (Vector DB)</text>
    </g>

    <g transform="translate(30, 230)">
      <rect x="0" y="0" width="310" height="170" rx="6" fill="#37474f" stroke="#455a64" stroke-width="1"/>
      <text x="20" y="30" fill="#66bb6a" font-size="16" font-weight="bold">🚀 DevOps 交付体系</text>
      <line x1="20" y1="45" x2="290" y2="45" stroke="#546e7a"/>
      
      <text x="25" y="75" fill="#cfd8dc" font-size="13">• 开发/测试/生产多环境管理</text>
      <text x="25" y="100" fill="#cfd8dc" font-size="13">• 源码级 Git 版本控制</text>
      <text x="25" y="125" fill="#cfd8dc" font-size="13">• 自动化流水线 (CI/CD)</text>
      <text x="25" y="150" fill="#cfd8dc" font-size="13">• 系统性能监控 (APM)</text>
    </g>

    <g transform="translate(360, 230)">
      <rect x="0" y="0" width="310" height="170" rx="6" fill="#37474f" stroke="#455a64" stroke-width="1"/>
      <text x="20" y="30" fill="#ab47bc" font-size="16" font-weight="bold">☁️ 云原生与信创</text>
      <line x1="20" y1="45" x2="290" y2="45" stroke="#546e7a"/>
      
      <text x="25" y="75" fill="#cfd8dc" font-size="13">• Docker / K8s 容器化部署</text>
      <text x="25" y="100" fill="#cfd8dc" font-size="13">• 弹性伸缩与负载均衡</text>
      <text x="25" y="125" fill="#cfd8dc" font-size="13">• 国产化数据库/系统适配</text>
      <text x="25" y="150" fill="#cfd8dc" font-size="13">• 私有云/混合云架构</text>
