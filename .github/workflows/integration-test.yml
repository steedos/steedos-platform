name: Integration Tests

on:
  push:
    branches:
      - main
      - 3.0
  pull_request:
    branches:
      - main
      - 3.0
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    env:
      MONGODB_USER: root
      MONGODB_PASSWORD: test_password_123
      MONGODB_DATABASE: steedos_test
    
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ env.MONGODB_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ env.MONGODB_PASSWORD }}
          MONGO_INITDB_DATABASE: ${{ env.MONGODB_DATABASE }}
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      nats:
        image: nats:latest
        ports:
          - 4222:4222
          - 8222:8222

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          CI: true

      - name: Wait for services
        run: |
          echo "Waiting for MongoDB..."
          for i in {1..30}; do
            if mongosh --host localhost:27017 --username ${{ env.MONGODB_USER }} --password ${{ env.MONGODB_PASSWORD }} --eval "db.adminCommand('ping')" > /dev/null 2>&1; then
              echo "MongoDB is ready!"
              break
            fi
            sleep 1
          done
          
          echo "Waiting for Redis..."
          for i in {1..30}; do
            if redis-cli -h localhost ping > /dev/null 2>&1; then
              echo "Redis is ready!"
              break
            fi
            sleep 1
          done
          
          echo "Waiting for NATS..."
          for i in {1..30}; do
            if curl -f http://localhost:8222/healthz > /dev/null 2>&1; then
              echo "NATS is ready!"
              break
            fi
            sleep 1
          done
          
          echo "All services are ready!"

      - name: Run integration tests
        run: |
          # Set up environment variables for integration tests
          export MONGO_URL=mongodb://${{ env.MONGODB_USER }}:${{ env.MONGODB_PASSWORD }}@localhost:27017/${{ env.MONGODB_DATABASE }}?authSource=admin
          export REDIS_URL=redis://localhost:6379
          export NATS_URL=nats://localhost:4222
          export NODE_ENV=test
          
          # Run integration tests if they exist
          pnpm -r --filter "./packages/**" --if-present test:integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            **/coverage/
            **/test-results/
          if-no-files-found: ignore

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          CI: true

      - name: Start services with Docker Compose
        run: |
          if [ -f "docker-compose.yml" ]; then
            docker-compose up -d mongodb mongodb-init redis nats
            sleep 10
          else
            echo "No docker-compose.yml found, skipping..."
          fi
        continue-on-error: true

      - name: Run E2E tests
        run: |
          # Run E2E tests if they exist
          pnpm -r --if-present test:e2e

      - name: Stop services
        if: always()
        run: |
          if [ -f "docker-compose.yml" ]; then
            docker-compose down
          fi
        continue-on-error: true

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            **/test-results/
            **/screenshots/
          if-no-files-found: ignore
