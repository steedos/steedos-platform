name: CI Test

on:
  push:
    branches:
      - main
      - 3.0
      - develop
  pull_request:
    branches:
      - main
      - 3.0
      - develop

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: |
          if [ -f "eslint.config.mjs" ]; then
            pnpm exec eslint . --max-warnings 0
          else
            echo "No linting configuration found, skipping..."
          fi

      - name: Type check
        run: |
          if [ -f "tsconfig.json" ]; then
            pnpm exec tsc --noEmit
          else
            echo "No TypeScript configuration found, skipping..."
          fi

      - name: Run tests
        run: |
          # Run tests for packages that have test scripts
          pnpm -r --if-present test

      - name: Build packages
        run: pnpm run build
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            **/coverage/
            **/test-results/
          if-no-files-found: ignore

  lint-commits:
    name: Lint commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commits
        run: |
          if [ -f ".commitlintrc.json" ]; then
            pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
          else
            echo "No commitlint configuration found, skipping..."
          fi

  dependency-check:
    name: Check dependencies
    runs-on: ubuntu-latest
    # Run as informational job that doesn't block the build
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for outdated dependencies
        id: outdated
        run: |
          echo "## Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          pnpm outdated --format table >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No outdated dependencies or check failed" >> $GITHUB_STEP_SUMMARY

      - name: Audit dependencies
        id: audit
        run: |
          echo "## Security Audit" >> $GITHUB_STEP_SUMMARY
          pnpm audit >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Security vulnerabilities found or audit failed" >> $GITHUB_STEP_SUMMARY
