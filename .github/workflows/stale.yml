name: Stale Issues and PRs

on:
  schedule:
    # Run daily at 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          # Issue settings
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had 
            recent activity. It will be closed if no further activity occurs within 7 days.
            
            If this issue is still relevant, please comment to keep it open.
          close-issue-message: |
            This issue was automatically closed because it has been inactive for more than 7 days after being marked as stale.
            
            If you believe this issue should be reopened, please create a new issue with updated information.
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,bug,critical'
          
          # PR settings
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had 
            recent activity. It will be closed if no further activity occurs within 7 days.
            
            If this PR is still relevant, please update it or comment to keep it open.
          close-pr-message: |
            This pull request was automatically closed because it has been inactive for more than 7 days after being marked as stale.
            
            If you want to continue with this PR, please reopen it or create a new one with updated changes.
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,in-progress'
          
          # General settings
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true
