name: Docker Sync

on:
  workflow_run:
    workflows: [Docker Release]
    types:
      - completed

  workflow_dispatch:
    # inputs:
    #   version:
    #     description: 'version to sync to aliyun & aws china, e.g. 3.0.25'
    #     required: true

jobs:
  docker-sync:
    runs-on: ubuntu-latest
    env:
      STEEDOS_VERSION: ${{ github.event.inputs.version}}
      
    steps:

      # checkout branch 2.7
      - name: Checkout branch 2.7
        uses: actions/checkout@v2
        with: 
          ref: '2.7'

      - name: Set Current Version
        run: |
          STEEDOS_VERSION=$(node -p 'require("./lerna.json").version')
          echo "STEEDOS_VERSION=${STEEDOS_VERSION}" >> $GITHUB_ENV
          echo "STEEDOS_VERSION=${STEEDOS_VERSION}"
        

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Aliyun Docker
        uses: docker/login-action@v2
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_NINGXIA }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_NINGXIA }}
          aws-region: cn-northwest-1

      - name: Login to ECR
        uses: docker/login-action@v2
        with:
          registry: 252208178451.dkr.ecr.cn-northwest-1.amazonaws.com.cn

      - name: Pull and Push steedos-enterprise
        run: |
          SRC=steedos/steedos-enterprise:${{ env.STEEDOS_VERSION }}
          docker pull $SRC

          docker tag $SRC 252208178451.dkr.ecr.cn-northwest-1.amazonaws.com.cn/dockerhub/steedos/steedos-enterprise:${{ env.STEEDOS_VERSION }}
          docker push 252208178451.dkr.ecr.cn-northwest-1.amazonaws.com.cn/dockerhub/steedos/steedos-enterprise:${{ env.STEEDOS_VERSION }}

          docker tag $SRC registry.cn-shanghai.aliyuncs.com/steedos/steedos-community:${{ env.STEEDOS_VERSION }}
          docker tag $SRC registry.cn-shanghai.aliyuncs.com/steedos/steedos-enterprise:${{ env.STEEDOS_VERSION }}

          docker push registry.cn-shanghai.aliyuncs.com/steedos/steedos-community:${{ env.STEEDOS_VERSION }}
          docker push registry.cn-shanghai.aliyuncs.com/steedos/steedos-enterprise:${{ env.STEEDOS_VERSION }}